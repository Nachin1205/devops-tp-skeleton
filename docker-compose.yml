services:
  web:
    # Construye la imagen
    build: .
    # nombra la imagen localmente
    image: devops-tp-skeleton:local
    ports:
      # expone el puerto 3000 del contenedor 
      - "3000:3000"
    environment:
      - NODE_ENV=production
 

    restart: unless-stopped
    healthcheck:
      test: ["CMD","node","-e","const p=process.env.PORT||3000; fetch(`http://localhost:${p}/health`).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

